name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        check-latest: true

    - name: Enable Yarn 4 via Corepack
      run: |
        npm install -g corepack
        corepack enable
        corepack prepare yarn@stable --activate

    - name: Install dependencies
      run: yarn install --no-immutable

    # `yarn build` encadena build:core y build:cli. Antes solo compilaba core, así que
    # un error de compilación en el CLI no llegaba a detectarse aquí.
    - name: Build core library and CLI
      run: yarn build

    - name: Run tests
      run: yarn test

    - name: Check code quality
      run: yarn lint 2>/dev/null || echo "Linter not configured yet"

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js (LTS)
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'

    - name: Enable Yarn 4 via Corepack
      run: |
        npm install -g corepack
        corepack enable
        corepack prepare yarn@stable --activate

    - name: Install dependencies
      run: yarn install --no-immutable

    - name: Run security audit
      run: yarn npm audit --all --severity high || true

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Check README exists
      run: test -f README.md && echo "✓ README present"

    - name: Check CONTRIBUTING exists
      run: test -f CONTRIBUTING.md && echo "✓ CONTRIBUTING guide present"

    - name: Check LICENSE exists
      run: test -f LICENSE && echo "✓ LICENSE present"
